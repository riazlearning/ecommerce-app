apiVersion: apps/v1
kind: Deployment

metadata:
  name: product-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:
        - name: product-service
          image: ecommerce/product-service:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8081

          env:
            - name: DB_HOST
              value: product-db

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: product_db

            - name: DB_USER
              value: postgres

            - name: DB_PASSWORD
              value: postgres
          
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 20
            periodSeconds: 5